<div class="bulk-interpretation"><p class="eyebrow">ACCOUNTING INTERPRETATION</p><h2>Bulk selected records</h2><p class="muted">Select records in the results list. Each posting will be appended to every selected record.</p><form id="bulk-interpretation-form" method="post" action="{{ url_for('save_records_bulk') }}" onsubmit="return collectSearchSelection(this)"><input type="hidden" name="return_status" value="{{ status }}"><input type="hidden" name="return_q" value="{{ query }}"><div id="bulk-postings"><div class="posting"><select name="posting_account"><option value="">Choose account</option>{% for value, label in account_options %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select><select name="posting_sign"><option value="positive">Positive amount</option><option value="negative">Negative amount</option></select><input name="posting_currency" value="" placeholder="Currency"><button type="button" class="remove-posting" onclick="removePosting(this)">Remove</button></div></div><button type="button" onclick="addBulkPosting(this)">+ Add account</button><div class="save-row"><button class="resolve" name="status" value="resolved">Save and resolve</button><button name="status" value="pending">Save and keep pending</button><button name="status" value="held">Hold</button><button name="status" value="ignored">Ignore</button></div></form></div>
